; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
build_flags = 
    -D USB_MIDI16_AUDIO_SERIAL 
    -UMIDI_NUM_CABLES  
    -DMIDI_NUM_CABLES=2

[env:emscripten]
platform = native
build_flags =
    -D KINETISL
    -D TEENSYDUINO=120
    -D __EMSCRIPTEN__
    -std=c++17
    -I perichord/shim
    -I include
    -I lib/button_matrix/src
    -I lib/debouncer/src
    -I lib/harp/src
    -I lib/potentiometer/src
    -I lib/Hx_plateReverb
    -I perichord/shim/Audio
    -I /opt/homebrew/Cellar/emscripten/4.0.16/libexec/cache/sysroot/include
    -I /opt/homebrew/Cellar/emscripten/4.0.16/libexec/cache/sysroot/include/compat
build_src_filter = 
    -<*>
    +<../perichord/shim/Arduino.cpp>
lib_deps = 
    Hx_plateReverb